server.port=9030
############################## REPO DE DATOS ###################################
#UAT
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_sat_uat}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.jpa.hibernate.dialect=org.hibernate.dialect.PostgreSQL10Dialect

############################################################## SERVIDOR DE CORREO ############################################
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
email.notificacion.heroca=${EMAIL_NOTIFICACION_HEROCA:}

############################################################## META - WSP  ###############################################

whatsapp.token=${WHATSAPP_TOKEN:}
whatsapp.url=${WHATSAPP_URL:}

############################################################## TWILIO - WSP SANDBOX  ###############################################

twilio.base-url=https://api.twilio.com
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
