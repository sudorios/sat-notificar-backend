name: CI SAT NOTIFICACIONES API

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build con Maven
        working-directory: ms-sat-notificar-api
        run: mvn clean package -DskipTests -U

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y Push de Docker
        uses: docker/build-push-action@v6
        with:
          context: ms-sat-notificar-api
          push: true
          tags: |
            ghcr.io/sudorios/sat-notificar-web-api:latest
            ghcr.io/sudorios/sat-notificar-web-api:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max